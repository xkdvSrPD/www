<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting...</title>
  <script>
    (function () {
      var hostname = window.location.hostname;
      if (hostname.indexOf('www.') === 0) {
        var target = window.location.protocol + '//' + hostname.slice(4) + window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(target);
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/">
  </noscript>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
